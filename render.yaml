services:
  - type: web
    name: infiniverse-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: infiniverse-db
          property: connectionString

databases:
  - name: infiniverse-db
    plan: free
